name: Keep Empwave Alive

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes (GitHub minimum)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          echo "Pinging Render health endpoint..."
          curl -v "${{ secrets.RENDER_APP_URL }}/health" || echo "⚠️ First ping failed, retrying..."
          sleep 5
          curl -f "${{ secrets.RENDER_APP_URL }}/health" || exit 1
        timeout-minutes: 2
        continue-on-error: true
